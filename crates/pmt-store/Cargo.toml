[package]
name = "pmt-store"
description = "Prometheus session storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
# Encryption at rest: page and blob sealing, passphrase keys, the OS keychain.
argon2.workspace = true
chacha20.workspace = true
chacha20poly1305.workspace = true
# Pairing code salts and codes.
getrandom.workspace = true
jiff.workspace = true
pmt-config.workspace = true
pmt-core.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
ulid.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
nix.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
tracing-subscriber.workspace = true
trybuild.workspace = true

# `unsafe` is denied (not forbidden, as in the workspace table) so the
# encrypting VFS, allowlisted in health.toml, can opt in with
# `#![allow(unsafe_code)]`; the health gate keeps every other module free of
# it. The rest mirrors [workspace.lints].
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
