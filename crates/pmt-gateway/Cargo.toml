[package]
name = "pmt-gateway"
description = "Prometheus gateway daemon: one per home, the control channel, the ticket-authenticated loopback JSON-RPC listener, session event streams and server-to-client requests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
bytes.workspace = true
futures-util.workspace = true
# Random instance ids, epochs, tickets and server-request ids.
getrandom.workspace = true
# The shared HTTP listener of webhook-style adapters.
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
jiff.workspace = true
pmt-config.workspace = true
pmt-core.workspace = true
# Chat notices and approval cards in the profile's language.
pmt-i18n.workspace = true
pmt-net.workspace = true
pmt-obs.workspace = true
pmt-rpc.workspace = true
# Conversation routes, pairing and the outbox live in each profile's state.db.
pmt-store.workspace = true
# vault.* methods.
pmt-vault.workspace = true
# Group mention patterns (`gateway.groups.mention_patterns`).
regex.workspace = true
# Adapters build their HTTP clients through the gateway's proxy rules.
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
# Tickets are kept only as hashes; the Windows control pipe is named by
# the home's hash.
sha2.workspace = true
# The agent cache sheds agents above a resident-memory mark.
sysinfo.workspace = true
# The conformance kit writes the files it sends into a scratch directory.
tempfile.workspace = true
tokio = { workspace = true, features = ["net", "io-util"] }
# The paired device registry (`run/devices.toml`).
toml.workspace = true
tokio-tungstenite.workspace = true
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["net", "io-util", "test-util"] }
tracing-subscriber.workspace = true

[lints]
workspace = true
