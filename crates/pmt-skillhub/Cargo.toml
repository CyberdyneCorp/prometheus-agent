[package]
name = "pmt-skillhub"
description = "Prometheus skills hub: sources, install pipeline, lockfile checks, taps, snapshots, publishing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
base64.workspace = true
jiff.workspace = true
minisign.workspace = true
minisign-verify.workspace = true
pmt-config.workspace = true
pmt-core.workspace = true
pmt-net.workspace = true
pmt-skills.workspace = true
regex.workspace = true
reqwest.workspace = true
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["rt"] }
tracing.workspace = true
ulid.workspace = true
x509-parser.workspace = true
zip.workspace = true

[features]
# Test support: a local fake of every hub endpoint.
testkit = []

[dev-dependencies]
pmt-skillhub = { path = ".", features = ["testkit"] }
rcgen = { workspace = true, features = ["x509-parser"] }
tempfile.workspace = true

[lints]
workspace = true
