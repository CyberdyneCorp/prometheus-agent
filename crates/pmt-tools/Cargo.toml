[package]
name = "pmt-tools"
description = "Prometheus tool system"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
base64.workspace = true
dunce.workspace = true
futures-util.workspace = true
glob.workspace = true
ignore.workspace = true
percent-encoding.workspace = true
image.workspace = true
pmt-config.workspace = true
pmt-core.workspace = true
pmt-net.workspace = true
pmt-sandbox.workspace = true
# browser_vault: the profile's credential vault.
pmt-vault.workspace = true
regex.workspace = true
reqwest.workspace = true
resvg.workspace = true
# read_file document extraction: .docx/.xlsx parts and SQLite overviews.
roxmltree.workspace = true
rusqlite.workspace = true
zip.workspace = true
saphyr-parser.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
similar.workspace = true
sysinfo.workspace = true
url.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "net"] }
tokio-tungstenite.workspace = true
toml.workspace = true
tracing.workspace = true
tree-sitter.workspace = true
tree-sitter-javascript.workspace = true
tree-sitter-python.workspace = true
tree-sitter-rust.workspace = true
tree-sitter-typescript.workspace = true
ulid.workspace = true
wiremock = { workspace = true, optional = true }

[features]
# A stateful fake of the Nous connector gateway for tests (`connectors::fake`).
connectors-fake = ["dep:wiremock"]

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["signal", "process"] }

[dev-dependencies]
wiremock.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

[[test]]
name = "connectors"
required-features = ["connectors-fake"]
