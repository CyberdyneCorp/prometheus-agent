[package]
name = "pmt-config"
description = "Prometheus configuration, profiles and secrets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
# MCP tool filters (`mcp.servers.<name>.tools`) are checked as globs.
glob.workspace = true
jiff.workspace = true
keyring-core.workspace = true
pmt-core.workspace = true
# Webhook filter patterns are checked when the configuration loads.
regex.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true
toml_edit.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
# The current user's uid (managed secrets ownership in test directories).
nix = { workspace = true, features = ["user"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store.workspace = true

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store.workspace = true
known-folders.workspace = true

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "android"))))'.dependencies]
dbus-secret-service-keyring-store.workspace = true

[dev-dependencies]
tempfile.workspace = true
trybuild.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
