[package]
name = "pmt-tui"
description = "Prometheus full-screen terminal UI: state, layout, rendering, key bindings and terminal restoration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
crossterm.workspace = true
jiff.workspace = true
pmt-config.workspace = true
pmt-core.workspace = true
ratatui.workspace = true
unicode-width.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["poll"] }

[target.'cfg(windows)'.dependencies]
crossterm_winapi.workspace = true

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Console"] }

# `unsafe` is denied (not forbidden, as in the workspace table) so the
# test-only console module allowlisted in health.toml can opt in with
# `#[allow(unsafe_code)]`; the health gate keeps every other module free
# of it. The rest mirrors [workspace.lints].
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
