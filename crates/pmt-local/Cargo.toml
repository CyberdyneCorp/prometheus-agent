[package]
name = "pmt-local"
description = "Prometheus local models: the llama.cpp engine, hardware-priced catalog, downloads, model library and managed llama-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
# The stand-in llama-server of the tests (never shipped).
name = "pmt-llama-stub"
path = "src/bin/stub.rs"
required-features = ["stub"]

[dependencies]
jiff.workspace = true
percent-encoding.workspace = true
pmt-config.workspace = true
pmt-core.workspace = true
pmt-net.workspace = true
pmt-update.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sysinfo.workspace = true
tokio.workspace = true
tracing.workspace = true
ulid.workspace = true

[dev-dependencies]
flate2.workspace = true
tar.workspace = true
tempfile.workspace = true
wiremock.workspace = true

[features]
# The stand-in llama-server binary (tests of this crate and the binary).
stub = []
# `testkit::stub()`: the stand-in's path, built on demand.
testkit = ["stub"]

[lints]
workspace = true
