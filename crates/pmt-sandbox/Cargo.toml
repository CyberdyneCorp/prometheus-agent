[package]
name = "pmt-sandbox"
description = "Prometheus OS sandbox: capability-to-policy translation, Landlock + seccomp (Linux), Seatbelt (macOS), AppContainer + Job Object (Windows), enforcement-strength report and the terminal backend registry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
pmt-config.workspace = true
pmt-core.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
landlock.workspace = true
seccompiler.workspace = true
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile.workspace = true
tracing-subscriber.workspace = true

# `unsafe` is denied (not forbidden, as in the workspace table) so the FFI
# modules allowlisted in health.toml can opt in with `#[allow(unsafe_code)]`;
# the health gate keeps every other module free of it. The rest mirrors
# [workspace.lints].
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
