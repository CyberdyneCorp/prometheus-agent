[package]
name = "pmt-net"
description = "Prometheus outbound networking: the shared HTTP client (platform-verified TLS, IPv4-only mode), destination policy and SSRF-safe fetch, loopback-first listeners and the network doctor group"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
pmt-core.workspace = true
# The one HTTP client every outbound caller builds on, with rustls; the
# crypto provider (ring) and verifier are supplied by `tls`.
# `socks`: adapters may reach their platform through a SOCKS5 proxy.
# `http2`: offered through ALPN; gRPC APIs (the modal backend plugin's
# direct mode) only answer over HTTP/2.
reqwest = { workspace = true, features = ["rustls-no-provider", "socks", "http2"] }
rustls.workspace = true
rustls-platform-verifier.workspace = true
rustls-native-certs.workspace = true
pkcs8.workspace = true
base64.workspace = true
ipnet.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "rt", "macros", "time"] }
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["net", "io-util", "test-util"] }
rcgen.workspace = true
tokio-rustls.workspace = true
tracing-subscriber.workspace = true
tempfile.workspace = true

[lints]
workspace = true
