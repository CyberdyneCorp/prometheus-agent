[package]
name = "pmt-net"
description = "Prometheus outbound networking: the shared HTTP client, IPv4-only mode and the network doctor group"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
pmt-core.workspace = true
# The one HTTP client every outbound caller builds on. TLS and body
# features are added by the first caller that needs them.
reqwest.workspace = true
tokio = { workspace = true, features = ["net"] }

[dev-dependencies]
tokio = { workspace = true, features = ["net", "io-util"] }

[lints]
workspace = true
