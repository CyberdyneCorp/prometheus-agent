[package]
name = "pmt-pybridge"
description = "Prometheus Python bridge: managed CPython sidecars hosting Hermes-style plugins"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
pmt-config.workspace = true
pmt-core.workspace = true
pmt-plugins.workspace = true
pmt-providers.workspace = true
pmt-tools.workspace = true
pmt-update.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sysinfo.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["rt"] }
tracing.workspace = true

base64 = { workspace = true, optional = true }
zip = { workspace = true, optional = true }

[features]
# Test support: the uv and interpreter a test home uses, wheel fixtures.
testkit = ["dep:base64", "dep:zip"]

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["signal", "process"] }

[dev-dependencies]
pmt-pybridge = { path = ".", features = ["testkit"] }
tempfile.workspace = true

[lints]
workspace = true
