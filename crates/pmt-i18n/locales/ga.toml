prompt = "ceadú? [o] uair amháin [s] seisiún [a] i gcónaí [d] diúltú [e] míniú › "
answer_hint = "freagair o (uair amháin), s (seisiún), a (i gcónaí) nó d (diúltú)"
not_approved = "níor ceadaíodh"
allowed_once = "Ceadaithe uair amháin"
allowed_session = "Ceadaithe don seisiún seo"
allowed_always = "Ceadaithe i gcónaí"
denied = "Diúltaithe"
explaining = "Á mhíniú; tiocfaidh an t-iarratas arís"
expired = "Chuaigh an cead in éag; diúltaíodh don ghníomh."
withdrawn = "Tarraingíodh an cead siar; diúltaíodh don ghníomh."
title = "Cead ag teastáil: {tool}"
action = "Gníomh: {subject}"
directory = "Comhadlann: {cwd}"
risk = "Riosca: {reason}"
on_expiry = "gan freagra, diúltaítear dó"
reply_hint = "Freagair /approve, /approve session, /approve always, /approve explain nó /deny."
