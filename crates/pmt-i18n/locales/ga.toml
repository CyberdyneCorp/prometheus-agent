resume_prompt = "an seal idirbhriste a atosú? [y/N] › "
autoprune_prompt = "glanadh uathoibríoch? [on/off/later] › "

[gateway]
stopped = "Stoptha. Is féidir leat leanúint leis an seisiún seo."
nothing_to_stop = "Níl aon tasc gníomhach le stopadh."
