[package]
name = "pmt-plugins"
description = "Prometheus plugin host: manifests, discovery, grants and the WASM component runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
base64.workspace = true
jiff.workspace = true
# Package signatures: verification, and `prometheus plugins sign`.
minisign.workspace = true
minisign-verify.workspace = true
pmt-config.workspace = true
pmt-core.workspace = true
# Model-provider plugins register `model-providers` descriptors.
pmt-providers.workspace = true
pmt-sandbox.workspace = true
pmt-skills.workspace = true
pmt-tools.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# `.pmtpkg` packages are zstd-compressed tars.
tar.workspace = true
# Install staging directories.
tempfile.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
wasmtime.workspace = true
zstd.workspace = true
wit-component = { workspace = true, optional = true }

[features]
# `testkit`: builds the repository's WASM plugins (plugins/) into
# components for tests of this crate and of the binary.
testkit = ["dep:wit-component"]

[dev-dependencies]
pmt-plugins = { path = ".", features = ["testkit"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
