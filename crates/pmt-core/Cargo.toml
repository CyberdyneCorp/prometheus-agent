[package]
name = "pmt-core"
description = "Prometheus core types, errors and ids"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
# UTC timestamps in crash-report file names.
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
# Process start times for runtime records (pid reuse detection), on every OS.
sysinfo.workspace = true
# Panic isolation spawns tasks; cancellation is a tokio-util token tree.
tokio.workspace = true
tokio-util.workspace = true
ulid.workspace = true

# getrlimit/setrlimit for the open-file soft limit raise.
[target.'cfg(unix)'.dependencies]
nix.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
