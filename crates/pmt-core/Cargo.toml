[package]
name = "pmt-core"
description = "Prometheus core types, errors and ids"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
# Base64 forms of known secrets in the redactor.
base64.workspace = true
# Path globs of fs.read / fs.write capabilities.
glob.workspace = true
# UTC timestamps in crash-report file names.
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
# Process start times for runtime records (pid reuse detection), on every OS.
sysinfo.workspace = true
# Phone, email and attribution patterns of PII redaction.
regex.workspace = true
# Registry entry names: a hash of the home path.
sha2.workspace = true
# Panic isolation spawns tasks; cancellation is a tokio-util token tree.
tokio.workspace = true
tokio-util.workspace = true
# WARN when a security audit record cannot be written.
tracing.workspace = true
ulid.workspace = true

# getrlimit/setrlimit for the open-file soft limit raise.
[target.'cfg(unix)'.dependencies]
nix.workspace = true

# Mach thread listing for task dumps (os_threads/macos.rs).
[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true

# Toolhelp thread listing and thread names for task dumps
# (os_threads/windows.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }

# flock(2) for the file locks: std's File::try_lock is unsupported there.
[target.'cfg(target_os = "android")'.dependencies]
rustix.workspace = true

[dev-dependencies]
proptest.workspace = true
# Paused time for prompt-timeout tests.
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true

# `unsafe` is denied (not forbidden, as in the workspace table) so the FFI
# modules allowlisted in health.toml (os_threads/macos.rs, windows.rs) can
# opt in with `#![allow(unsafe_code)]`; the health gate keeps every other
# module free of it. The rest mirrors [workspace.lints].
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
