[package]
name = "prometheus"
description = "The Prometheus Agent binary (alias pmt)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "prometheus"
path = "src/main.rs"

# Optional surfaces (`prometheus version --verbose` lists them). A build
# without one answers its command with exit 69; each feature gains the
# surface crate as an optional dependency when that surface lands.
[features]
default = ["tui", "gateway", "dashboard", "acp", "mcp", "evolve", "eval"]
tui = []
gateway = []
dashboard = []
acp = []
mcp = []
evolve = []
eval = []

[dependencies]
clap.workspace = true
jiff.workspace = true
pmt-backup.workspace = true
pmt-config.workspace = true
pmt-core.workspace = true
pmt-obs.workspace = true
pmt-store.workspace = true
rpassword.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
# WARN events for startup conditions; the subscriber arrives with logging.
tracing.workspace = true

[build-dependencies]
jiff.workspace = true
sha2.workspace = true

[dev-dependencies]
rusqlite.workspace = true
tempfile.workspace = true

[target.'cfg(unix)'.dev-dependencies]
nix.workspace = true

[lints]
workspace = true
