[package]
name = "prometheus"
description = "The Prometheus Agent binary (alias pmt)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "prometheus"
path = "src/main.rs"

# Optional surfaces (`prometheus version --verbose` lists them). A build
# without one answers its command with exit 69; each feature gains the
# surface crate as an optional dependency when that surface lands.
# Released by cargo-dist (dist-workspace.toml); `publish = false` would
# otherwise hide it.
[package.metadata.dist]
dist = true

[features]
default = ["tui", "gateway", "dashboard", "acp", "mcp", "evolve", "eval"]
tui = ["dep:pmt-tui", "dep:ratatui"]
gateway = [
    "dep:pmt-gateway",
    "dep:pmt-adapters-telegram",
    "dep:pmt-adapters-discord",
    "dep:pmt-adapters-slack",
    "dep:pmt-adapters-email",
    "dep:pmt-adapters-matrix",
    "dep:pmt-adapters-signal",
    "dep:pmt-adapters-whatsapp",
    "dep:pmt-adapters-webhook",
]
dashboard = []
acp = []
mcp = []
evolve = []
eval = []

[dependencies]
clap.workspace = true
jiff.workspace = true
pmt-agent.workspace = true
pmt-backup.workspace = true
pmt-config.workspace = true
pmt-core.workspace = true
pmt-gateway = { workspace = true, optional = true }
pmt-adapters-telegram = { workspace = true, optional = true }
pmt-adapters-discord = { workspace = true, optional = true }
pmt-adapters-email = { workspace = true, optional = true }
pmt-adapters-matrix = { workspace = true, optional = true }
pmt-adapters-signal = { workspace = true, optional = true }
pmt-adapters-slack = { workspace = true, optional = true }
pmt-adapters-webhook = { workspace = true, optional = true }
pmt-adapters-whatsapp = { workspace = true, optional = true }
pmt-memory.workspace = true
pmt-net.workspace = true
pmt-obs.workspace = true
pmt-providers.workspace = true
pmt-rpc.workspace = true
pmt-sandbox.workspace = true
pmt-skills.workspace = true
pmt-store.workspace = true
pmt-tools.workspace = true
pmt-tui = { workspace = true, optional = true }
pmt-update.workspace = true
pulldown-cmark.workspace = true
ratatui = { workspace = true, optional = true }
# The terminal size for the line interface's bottom status line too.
crossterm.workspace = true
# `/copy` in the TUI: the OSC 52 clipboard sequence carries base64.
base64.workspace = true
reqwest.workspace = true
rpassword.workspace = true
rustyline.workspace = true
serde.workspace = true
serde_json.workspace = true
# `demo` runs in a fresh temporary directory.
tempfile.workspace = true
toml.workspace = true
# Input ids of the TUI's prompts and idempotency keys of its creates.
ulid.workspace = true
# `logs --follow` polls and stops on Ctrl-C.
tokio = { workspace = true, features = ["signal"] }
tracing.workspace = true
unicode-width.workspace = true

[target.'cfg(unix)'.dependencies]
# The controlling terminal's device and session leader (`-c` per terminal);
# SIGTSTP for the line interface's Ctrl+Z; the effective uid for
# `daemon install-service --system` and the launchd GUI domain.
nix = { workspace = true, features = ["term", "process", "signal", "user"] }

[build-dependencies]
jiff.workspace = true
sha2.workspace = true

[dev-dependencies]
flate2.workspace = true
minisign.workspace = true
tar.workspace = true
rusqlite.workspace = true
tempfile.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
zstd.workspace = true
wiremock.workspace = true

[target.'cfg(unix)'.dev-dependencies]
# SIGINT for the `logs --follow` exit-130 test.
nix = { workspace = true, features = ["signal"] }
# The line-interface tests run the binary in a pseudo-terminal.
expectrl.workspace = true

[lints]
workspace = true
