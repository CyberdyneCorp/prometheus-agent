[[rule]]
user = "Check the README"
text = "README checked: total 85.15"
repeat = true

[[rule]]
user = "Count the entries"
text = "One entry."
repeat = true

[[rule]]
user = "review the ledger"
step = 0
[[rule.tool_calls]]
name = "delegate_task"
arguments = { tasks = [{ goal = "Check the README" }, { goal = "Count the entries" }] }

[[rule]]
tool_result_regex = "(?s)README checked: total 85.15.*One entry\\.|(?s)One entry\\..*README checked: total 85.15"
text = "Both subagents finished."

[[rule]]
repeat = true
text = "unexpected"
