[[rule]]
step = 0
[[rule.tool_calls]]
name = "read_file"
arguments = { path = "README.md" }
[[rule.tool_calls]]
name = "read_file"
arguments = { path = "OWNERS.md" }

# Both results of the batch must come back: a dispatch that loses or
# fails either call falls through to "unexpected".
[[rule]]
step = 1
tool_result = ["Total: 85.15", "Owner: finance team"]
text = "finance team, 85.15"

[[rule]]
repeat = true
text = "unexpected"
