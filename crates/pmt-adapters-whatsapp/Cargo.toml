[package]
name = "pmt-adapters-whatsapp"
description = "Prometheus first-party WhatsApp adapter: the WhatsApp Web bridge runtime over loopback HTTP"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[features]
# The mock platform server the conformance kit runs this adapter against
# (`pub mod mock`, `prometheus plugins test-adapter`).
kit = []

[dependencies]
futures-util.workspace = true
# The managed bridge's per-launch bearer token.
getrandom.workspace = true
jiff.workspace = true
pmt-config.workspace = true
pmt-core.workspace = true
pmt-gateway.workspace = true
percent-encoding.workspace = true
pmt-update.workspace = true
sha2.workspace = true
pmt-net.workspace = true
reqwest.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "process", "fs"] }
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
# The tests run the adapter against its mock.
pmt-adapters-whatsapp = { path = ".", features = ["kit"] }
pmt-store.workspace = true
tempfile.workspace = true

[lints]
workspace = true
