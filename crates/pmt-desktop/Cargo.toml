[package]
name = "pmt-desktop"
description = "Prometheus desktop shell core: daemon attachment through the bundled binary, dial tickets, the native command allowlist, link and navigation policy and deep links, independent of the webview toolkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
pmt-core.workspace = true
# Device credentials of remote connections live in the OS keychain.
pmt-config.workspace = true
# Update downloads go through the shared outbound HTTP client.
pmt-net.workspace = true
reqwest.workspace = true
# Update signatures (minisign, like every release file).
minisign-verify.workspace = true
# Unpacking a staged macOS update archive (`.app.tar.gz`).
flate2.workspace = true
tar.workspace = true
# The control channel (dial tickets, daemon status) and the protocol major.
pmt-rpc.workspace = true
# Version skew: the daemon's and the bundled binary's semantic versions.
semver.workspace = true
serde.workspace = true
# The `[desktop]` section of the profile's config.toml.
toml.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "net"] }
tracing.workspace = true
# Endpoint, external link and deep link parsing.
url.workspace = true
# Remote connections: TLS with certificate pins, the shell's own client
# protocol calls, SSH host-key fingerprints and forwarder tickets.
rustls.workspace = true
tokio-rustls.workspace = true
webpki.workspace = true
sha2.workspace = true
base64.workspace = true
getrandom.workspace = true
futures-util.workspace = true
tokio-tungstenite.workspace = true

[dev-dependencies]
tempfile.workspace = true
# Signs the update fixtures with the test key.
minisign.workspace = true
# Captures the WARN log of a refused plugin command.
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "test-util"] }

[lints]
workspace = true
