[package]
name = "pmt-mcp"
description = "Prometheus MCP client (external servers over stdio and streamable HTTP) and MCP server mode"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
# The reference and misbehaving MCP server of the tests (never shipped).
name = "pmt-mcp-fixture"
path = "src/bin/fixture.rs"
required-features = ["fixture"]

[dependencies]
bytes.workspace = true
glob.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util.workspace = true
pmt-config.workspace = true
pmt-core.workspace = true
pmt-tools.workspace = true
reqwest.workspace = true
rmcp = { workspace = true, features = [
    "client",
    "server",
    "transport-async-rw",
    "transport-io",
    "transport-streamable-http-client-reqwest",
    "transport-streamable-http-server",
] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "io-std", "net"] }
tokio-util.workspace = true
tracing.workspace = true

[features]
# The fixture server binary and module (tests of this crate and the binary).
fixture = []
# `testkit::fixture()`: the fixture binary's path, built on demand.
testkit = ["fixture"]

[dev-dependencies]
pmt-mcp = { path = ".", features = ["testkit"] }
pmt-net.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
