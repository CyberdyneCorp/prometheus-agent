# The documentation site, built with `mdbook build docs` (pinned in
# scripts/check). Pages under reference/ are generated by `cargo xtask gen`
# and never edited by hand.

[book]
title = "Prometheus Agent"
language = "en"
src = "."

[build]
# Output stays under target/ so a build never dirties the tree.
build-dir = "../target/docs"
# A page listed in SUMMARY.md that does not exist fails the build instead of
# being created empty.
create-missing = false


# The generated wire reference repeats every contract's field docs, and the
# generated error-code table repeats each code's message; the search index
# stays under mdbook's 10 MB warning without them (the guides explain the
# same methods and errors in prose).
[output.html.search.chapter]
"reference/rpc.md" = { enable = false }
"reference/error-codes.md" = { enable = false }
