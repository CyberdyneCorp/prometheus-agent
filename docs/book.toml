# The documentation site, built with `mdbook build docs` (pinned in
# scripts/check). Pages under reference/ are generated by `cargo xtask gen`
# and never edited by hand.

[book]
title = "Prometheus Agent"
language = "en"
src = "."

[build]
# Output stays under target/ so a build never dirties the tree.
build-dir = "../target/docs"
# A page listed in SUMMARY.md that does not exist fails the build instead of
# being created empty.
create-missing = false

