# First-party catalog adapter: WeCom callback mode (spec: platform-adapters,
# WeCom callback adapter). Self-built WeCom apps post encrypted XML
# callbacks to the shared listener (`/p/<profile>/wecom_callback/`); each
# POST is acknowledged at once and the reply goes out through the app's
# message API. Configure `[gateway.platforms.wecom_callback]` option
# `apps = [{name, corp_id, agent_id}, ...]` (at most 4) and, for the n-th
# app (1-based), `prometheus secrets set WECOM_CALLBACK_CORP_SECRET_<n>`,
# `WECOM_CALLBACK_TOKEN_<n>` and `WECOM_CALLBACK_AES_KEY_<n>` (the
# 43-character EncodingAESKey).
manifest_version = 1
id = "wecom_callback"
version = "1.0.0"
kind = "wasm"
description = "WeCom self-built apps in callback mode: encrypted XML in, message API out."
license = "MIT"
requires_prometheus = ">=0.1"
worlds = ["platform-adapter@1.0"]

[capabilities]
network = ["qyapi.weixin.qq.com"]
secrets = [
  "WECOM_CALLBACK_CORP_SECRET_1", "WECOM_CALLBACK_TOKEN_1", "WECOM_CALLBACK_AES_KEY_1",
  "WECOM_CALLBACK_CORP_SECRET_2", "WECOM_CALLBACK_TOKEN_2", "WECOM_CALLBACK_AES_KEY_2",
  "WECOM_CALLBACK_CORP_SECRET_3", "WECOM_CALLBACK_TOKEN_3", "WECOM_CALLBACK_AES_KEY_3",
  "WECOM_CALLBACK_CORP_SECRET_4", "WECOM_CALLBACK_TOKEN_4", "WECOM_CALLBACK_AES_KEY_4",
]
