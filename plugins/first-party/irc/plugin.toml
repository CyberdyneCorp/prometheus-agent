# First-party catalog adapter: IRC (spec: platform-adapters, IRC adapter).
# The connection is held by the socket bridge sidecar (the WASM sandbox has
# no sockets). Configure `[gateway.platforms.irc]` with options `server`,
# `channels` and optionally `port`, `use_tls`, `nickname`; grant the
# server to the plugin (`prometheus grants add plugin:irc@<digest>
# net.connect:<server>:<port>`; the bridge connects only where it may).
# Optional secrets: IRC_SERVER_PASSWORD, IRC_NICKSERV_PASSWORD.
manifest_version = 1
id = "irc"
version = "1.0.0"
kind = "wasm"
description = "IRC channels and private messages through a TLS (or plain) connection."
license = "MIT"
requires_prometheus = ">=0.1"
worlds = ["platform-adapter@1.0"]

[capabilities]
network = ["127.0.0.1"]
secrets = ["IRC_SERVER_PASSWORD", "IRC_NICKSERV_PASSWORD"]

[sidecar]
runtime = "node"
command = "sidecar/bridge.mjs"
lockfile = "sidecar/package-lock.json"
