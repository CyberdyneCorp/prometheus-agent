# First-party catalog adapter: DingTalk (spec: platform-adapters, DingTalk
# adapter). Stream Mode: the socket bridge sidecar holds the outbound
# WebSocket, so no public URL is needed. Configure
# `[gateway.platforms.dingtalk]` with option `client_id` (the app key) and
# optionally `robot_code`, `card_template_id` (stream replies as AI
# Cards), `free_response_chats`, `mention_patterns`; `prometheus secrets
# set DINGTALK_CLIENT_SECRET`. Grant the stream endpoint host the gateway
# hands out (`prometheus grants add plugin:dingtalk@<digest>
# net.connect:<host>:443`).
manifest_version = 1
id = "dingtalk"
version = "1.0.0"
kind = "wasm"
description = "DingTalk bots over Stream Mode, with AI Card streaming."
license = "MIT"
requires_prometheus = ">=0.1"
worlds = ["platform-adapter@1.0"]

[capabilities]
network = ["api.dingtalk.com", "oapi.dingtalk.com", "127.0.0.1"]
secrets = ["DINGTALK_CLIENT_SECRET"]

[sidecar]
runtime = "node"
command = "sidecar/bridge.mjs"
lockfile = "sidecar/package-lock.json"
