# First-party catalog adapter: SimpleX (spec: platform-adapters, SimpleX
# adapter). Talks to a local `simplex-chat` daemon's WebSocket API (run
# `simplex-chat -p 5225`), held by the socket bridge sidecar. Configure
# `[gateway.platforms.simplex]` with optionally `ws_url` (default
# ws://127.0.0.1:5225), `auto_accept` (default true) and `allow_groups`
# (group ids); `allow_users` takes numeric contact ids. To receive files,
# grant the daemon's files folder (`prometheus grants add
# plugin:simplex@<digest> fs.read:<folder>/**`); files are sent by path.
manifest_version = 1
id = "simplex"
version = "1.0.0"
kind = "wasm"
description = "SimpleX Chat through a local simplex-chat daemon."
license = "MIT"
requires_prometheus = ">=0.1"
worlds = ["platform-adapter@1.0"]

[capabilities]
network = ["127.0.0.1"]

[sidecar]
runtime = "node"
command = "sidecar/bridge.mjs"
lockfile = "sidecar/package-lock.json"
