# First-party catalog adapter: Yuanbao (spec: platform-adapters, Yuanbao
# adapter; Feishu and Yuanbao tools). The socket bridge sidecar holds the
# gateway WebSocket (protobuf frames). Configure
# `[gateway.platforms.yuanbao]` option `app_id` and optionally
# `dm_policy`, `group_policy` (open, allowlist, disabled; default open),
# `allow_from`, `group_allow_from`; `prometheus secrets set
# YUANBAO_APP_SECRET`. The `yuanbao` toolset (group info and members, DMs
# to members, stickers) acts through the running adapter.
manifest_version = 1
id = "yuanbao"
version = "1.0.0"
kind = "wasm"
description = "Tencent Yuanbao bots: DMs and groups, forwarded chat history, stickers."
license = "MIT"
requires_prometheus = ">=0.1"
worlds = ["platform-adapter@1.0"]

[capabilities]
network = ["bot.yuanbao.tencent.com", "bot-wss.yuanbao.tencent.com", "*.cos.accelerate.myqcloud.com", "*.myqcloud.com", "127.0.0.1"]
secrets = ["YUANBAO_APP_SECRET"]

[sidecar]
runtime = "node"
command = "sidecar/bridge.mjs"
lockfile = "sidecar/package-lock.json"
