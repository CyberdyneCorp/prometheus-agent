# First-party catalog adapter: ntfy (spec: platform-adapters, ntfy
# adapter). The topic's JSON stream is held by the socket bridge sidecar;
# replies are published over HTTP. Configure `[gateway.platforms.ntfy]`
# with options `topic` and optionally `server_url` (default
# https://ntfy.sh), `publish_topic`, `markdown`; list the topic in
# `allow_users` to admit what is published to it (without an allowlist
# the adapter only publishes). Optional secret NTFY_TOKEN (access token).
# A self-hosted server must be granted to the plugin (`prometheus grants
# add plugin:ntfy@<digest> net.connect:<host>:<port>`).
manifest_version = 1
id = "ntfy"
version = "1.0.0"
kind = "wasm"
description = "ntfy topics: published notifications in, replies published out."
license = "MIT"
requires_prometheus = ">=0.1"
worlds = ["platform-adapter@1.0"]

[capabilities]
network = ["ntfy.sh", "127.0.0.1"]
secrets = ["NTFY_TOKEN"]

[sidecar]
runtime = "node"
command = "sidecar/bridge.mjs"
lockfile = "sidecar/package-lock.json"
