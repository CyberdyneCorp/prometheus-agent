# First-party catalog adapter: Home Assistant (spec: platform-adapters,
# Home Assistant adapter and toolset). State changes arrive over the Home
# Assistant WebSocket API, held by the socket bridge sidecar; replies are
# persistent notifications, and cron can deliver to
# `homeassistant:<notify target>`. Set `prometheus secrets set HASS_TOKEN`
# (a long-lived access token) and options `url` (default
# http://homeassistant.local:8123) and `watch_domains`, `watch_entities`
# or `watch_all`. A server elsewhere must be granted to the plugin
# (`prometheus grants add plugin:homeassistant@<digest> net.connect:<host>:<port>`).
# The `homeassistant` toolset (ha_list_entities, ha_get_state,
# ha_list_services, ha_call_service) comes with the platform.
manifest_version = 1
id = "homeassistant"
version = "1.0.0"
kind = "wasm"
description = "Home Assistant state changes in, persistent notifications out."
license = "MIT"
requires_prometheus = ">=0.1"
worlds = ["platform-adapter@1.0"]

[capabilities]
network = ["homeassistant.local:8123", "127.0.0.1"]
secrets = ["HASS_TOKEN"]

[sidecar]
runtime = "node"
command = "sidecar/bridge.mjs"
lockfile = "sidecar/package-lock.json"
