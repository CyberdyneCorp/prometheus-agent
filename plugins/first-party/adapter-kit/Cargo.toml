[package]
name = "adapter-kit"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Shared by the first-party catalog adapter plugins (spec:
# platform-adapters, Catalog adapter set): the `platform-adapter` bindings
# and export macro, host calls (HTTP with the WIT failure prefixes,
# secrets, state), the inbound/outgoing JSON forms, access policies, text
# splitting, request signatures and the socket bridge client. The pure
# parts are unit-tested on the host (`cargo test` in plugins/).
[lib]
crate-type = ["rlib"]

[dependencies]
wit-bindgen.workspace = true
serde_json.workspace = true
hmac = "0.12.1"
sha1 = "0.10.6"
sha2 = "0.10.9"
base64 = "0.22.1"
aes = "0.8.4"
cbc = "0.1.2"
# RSA for RS256 tokens (jwt.rs): constant-time modular exponentiation.
crypto-bigint = { version = "0.5.5", default-features = false }
