# First-party catalog adapter: BlueBubbles iMessage (spec:
# platform-adapters, BlueBubbles iMessage adapter). The adapter registers
# its webhook on the BlueBubbles server at connect (removed at a clean
# stop); events arrive on the shared listener (`/p/<profile>/bluebubbles/`).
# Configure `[gateway.platforms.bluebubbles]` with options `server_url`,
# `public_url` (the URL the server reaches that route at) and optionally
# `send_read_receipts` (default true), `require_mention` and
# `mention_patterns` (group chats); `prometheus secrets set
# BLUEBUBBLES_PASSWORD`; grant the server (`prometheus grants add
# plugin:bluebubbles@<digest> net.connect:<host>:<port>`).
manifest_version = 1
id = "bluebubbles"
version = "1.0.0"
kind = "wasm"
description = "iMessage through a BlueBubbles server."
license = "MIT"
requires_prometheus = ">=0.1"
worlds = ["platform-adapter@1.0"]

[capabilities]
network = []
secrets = ["BLUEBUBBLES_PASSWORD"]
