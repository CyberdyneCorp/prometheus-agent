# Egress proxy of compose.isolated.yaml: HTTPS CONNECT (and plain HTTP) to
# the hosts in allowlist.txt only; everything else is denied.
http_port 3128
acl allowed dstdomain "/etc/squid/allowlist.txt"
acl SSL_ports port 443
acl CONNECT method CONNECT
http_access deny CONNECT !SSL_ports
http_access allow allowed
http_access deny all
cache deny all
# Access log in the container (docker exec egress-proxy tail /var/log/squid/access.log).
access_log daemon:/var/log/squid/access.log
