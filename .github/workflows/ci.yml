# CI runs scripts/check and nothing else on Tier 1 (`--no-perf`: the budgets
# only apply to the reference runner), so a green local `scripts/check`
# predicts a green check job (spec: workspace-architecture,
# Repository health gates; Supported targets and support tiers). Every Tier 1
# job then runs `prometheus demo` and the bundled smoke suite
# (`prometheus smoke-suite`) with networking disabled, and the Tier 2
# targets build and pass the same offline smoke run (tasks 21.2, 51.3;
# scripts/ci/offline-demo). The perf job runs
# `scripts/check --perf` on one fixed reference runner, where the regression
# check compares with the base branch measured in the same job
# (perf/README.md).
#
# Every action is pinned to a full commit SHA; the comment names its tag.

name: CI

on:
  workflow_dispatch:
  # Every base branch: stacked milestone PRs target each other, not main.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  check:
    name: check (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    # The Intel macOS runner needs ~35 min for a cold build alone (clippy
    # plus the test build) before ~25 min of tests; 60 min cancelled it.
    # The Apple silicon one reached 60 min in the smoke step after its
    # tests (desktop gate included), so it gets 75.
    timeout-minutes: ${{ matrix.os == 'macos-15-intel' && 90 || matrix.os == 'macos-15' && 75 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: aarch64-apple-darwin }
          # The last Intel macOS image GitHub hosts; macos-13 is retired.
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
    env:
      # Cargo, nextest and the doctests all honour this, so scripts/check
      # itself needs no target flag and stays the same command as locally.
      CARGO_BUILD_TARGET: ${{ matrix.target }}
      # The container and SSH backend tests run on the runner's Docker
      # (podman on the images lacks rootless cgroup delegation); on the
      # x86_64 gnu job a missing runtime fails them instead of skipping.
      PMT_TEST_CONTAINER_RUNTIME: ${{ startsWith(matrix.os, 'ubuntu') && 'docker' || 'auto' }}
      PMT_TEST_CONTAINERS: ${{ matrix.target == 'x86_64-unknown-linux-gnu' && 'require' || '' }}
      # The singularity backend's real-instance test runs the pinned
      # Apptainer installed below on the x86_64 gnu job; elsewhere it skips.
      PMT_TEST_APPTAINER: ${{ matrix.target == 'x86_64-unknown-linux-gnu' && 'require' || '' }}
      # The read_file document test installs the pinned doc-converter
      # runtime (a download per job) and converts real files with it.
      PMT_TEST_DOC_CONVERTER: require
      # The LSP test installs the pinned pyright with npm (setup-node below)
      # and checks a real undefined-name diagnostic.
      PMT_TEST_LSP: require
    steps:
      # Full history: the health ratchet compares health.toml with the merge
      # base on origin/main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Read pinned tool versions from scripts/check
        run: sed -n 's/^readonly \([A-Z_]*_VERSION\)=\(.*\)$/\1=\2/p' scripts/check >>"$GITHUB_ENV"

      # The toolchain comes from rust-toolchain.toml; an empty build-warnings
      # keeps CI's cargo environment identical to a developer's.
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          target: ${{ matrix.target }}
          build-warnings: ""
          cache-key: ${{ matrix.target }}
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}

      # musl-gcc for build scripts that compile C (the cc crate looks for it).
      - name: Install musl-tools
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      # The desktop app (scripts/check's desktop gate) builds against
      # WebKitGTK on the glibc Linux targets.
      - name: Install the desktop app's webview libraries
        if: runner.os == 'Linux' && !endsWith(matrix.target, '-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev libxdo-dev

      # The shell-completion tests load the scripts in bash and zsh.
      - name: Install zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh

      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-deny@${{ env.CARGO_DENY_VERSION }},cargo-nextest@${{ env.CARGO_NEXTEST_VERSION }},mdbook@${{ env.MDBOOK_VERSION }},cargo-component@${{ env.CARGO_COMPONENT_VERSION }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install OpenSpec CLI
        run: npm install -g "@fission-ai/openspec@$OPENSPEC_VERSION"

      # The browser tests drive a real headless Chromium; the Linux ARM
      # images ship no Chromium-family browser (the others ship Chrome).
      - name: Install Chromium for the browser tests
        if: runner.os == 'Linux' && runner.arch == 'ARM64'
        run: npx --yes playwright@1.49.1 install --with-deps chromium

      # The dashboard's browser tests drive the Chromium of the Playwright
      # pinned in web/package.json; scripts/check installs it, the system
      # libraries it needs come first on Linux.
      - name: Install the dashboard test browser's system libraries
        if: runner.os == 'Linux'
        run: |
          npm ci --prefix web --no-audit --no-fund
          (cd web && npx --no-install playwright install-deps chromium)

      # Ubuntu 24.04's AppArmor refuses unprivileged user namespaces, which
      # Chromium's own sandbox needs ("No usable sandbox!" then SIGABRT).
      - name: Allow user namespaces for Chromium's sandbox
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Apptainer runs unprivileged in a user namespace (allowed above).
      - name: Install Apptainer for the singularity backend test
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          deb="$RUNNER_TEMP/apptainer_1.4.2_amd64.deb"
          curl -fsSL -o "$deb" https://github.com/apptainer/apptainer/releases/download/v1.4.2/apptainer_1.4.2_amd64.deb
          echo "c4729da28ea832b8b7d7e4f882da607498f0462011801c15ea049a5643fda3b2  $deb" | sha256sum -c -
          sudo apt-get update
          sudo apt-get install -y "$deb"
          apptainer --version

      # The python-bridge tests run real sidecars: the pinned uv and the
      # CPython it provisions, installed before the tests so none downloads.
      - name: Install uv and the python-bridge test interpreter
        run: scripts/ci/install-uv "$RUNNER_TEMP/uv"

      - name: scripts/check
        # The budgets apply to the reference runner only; the perf job runs them.
        run: scripts/check --no-perf

      # The OTLP export (http/protobuf and gRPC) against a real
      # OpenTelemetry Collector container (spec: observability, Opt-in
      # OpenTelemetry export).
      - name: OTLP export against an OpenTelemetry Collector
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: scripts/ci/otel-collector

      # A build without an optional surface still answers to its name with
      # exit 69 (spec: workspace-architecture, Version and build
      # identity), and the gateway's remote client attachment and device
      # revocation work without the dashboard (spec: messaging-gateway,
      # Remote client attachment); only the prometheus crate rebuilds.
      - name: Minimal build without the dashboard
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo test --locked -p prometheus --no-default-features --features tui,gateway,acp,mcp,evolve,eval --test surface_cli --test remote_attach

      # The offline demo end to end, then the smoke suite, with networking
      # disabled (spec: replay-and-evaluation, Offline smoke demo; Built-in
      # smoke suite).
      - name: Offline demo and smoke suite (networking disabled)
        run: |
          cargo build --locked -p prometheus
          scripts/ci/offline-demo "target/$CARGO_BUILD_TARGET/debug/prometheus"

  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc }
          - { os: ubuntu-24.04, target: aarch64-linux-android }
    env:
      # Termux's minimum Android API level.
      ANDROID_API: 24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          target: ${{ matrix.target }}
          build-warnings: ""
          cache-key: ${{ matrix.target }}
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}

      # The runner image ships the NDK; cargo needs its clang as the linker
      # and cc-based build scripts need its compiler and archiver.
      - name: Point cargo at the Android NDK
        if: matrix.target == 'aarch64-linux-android'
        run: |
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          {
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$bin/aarch64-linux-android$ANDROID_API-clang"
            echo "CC_aarch64_linux_android=$bin/aarch64-linux-android$ANDROID_API-clang"
            echo "AR_aarch64_linux_android=$bin/llvm-ar"
          } >>"$GITHUB_ENV"

      - name: cargo build
        run: cargo build --workspace --all-targets --all-features --locked --target "${{ matrix.target }}"

      # The terminal tool inside the enforced AppContainer sandbox
      # (execution-environments, Windows local shell — Sandboxed session on
      # Windows): commands run confined in PowerShell, move around the
      # workspace, run a script, and cannot write outside it.
      - name: Windows sandboxed terminal tests
        if: runner.os == 'Windows'
        run: cargo test -p prometheus --test terminal_windows --locked --target "${{ matrix.target }}"

      # The AppContainer backend itself (security-boundaries, OS sandbox per
      # platform; Egress enforcement for child processes): confinement,
      # strength report, ACL revocation, and a proxied child's network.
      - name: Windows sandbox tests
        if: runner.os == 'Windows' && !cancelled()
        run: cargo test -p pmt-sandbox --test sandbox --locked --target "${{ matrix.target }}" -- "windows::"

      # The desktop app on WebView2 (desktop-app, Native command allowlist;
      # Windows never open themselves; Deep links): its Tauri IPC tests on
      # the mock runtime with the app's capability file.
      - name: Windows desktop app tests
        if: runner.os == 'Windows' && !cancelled()
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --target-dir target/desktop --locked --target "${{ matrix.target }}"

      # The dashboard's platform support matrix (web-dashboard, Honest
      # platform support matrix — Sandbox strength on Windows): the
      # sandbox.local row reports the AppContainer's real enforcement, and
      # a policy it cannot fully enforce is degraded with the reason.
      - name: Windows platform support matrix tests
        if: runner.os == 'Windows' && !cancelled()
        run: cargo test -p prometheus --lib --locked --target "${{ matrix.target }}" -- "daemon_cmd::support_matrix::"

      # A real local browser inside the AppContainer (execution-environments,
      # Local browser isolation): the pinned chrome-headless-shell runtime
      # (downloaded per job), DevTools over inherited pipe handles, every
      # browser process contained, pages reached only through the proxy.
      - name: Windows browser isolation tests
        if: runner.os == 'Windows' && !cancelled()
        env:
          PMT_TEST_BROWSER_RUNTIME: require
        run: cargo test -p prometheus --test browser_windows --locked --target "${{ matrix.target }}"

      # The offline smoke run of a Tier 2 target (spec: workspace-architecture,
      # Supported targets and support tiers; replay-and-evaluation, Built-in
      # smoke suite): the demo's CLI tests, then `prometheus demo` and the
      # bundled smoke suite (`prometheus smoke-suite`; its `interrupt` task
      # sends Ctrl+Break to the run's own console process group) with the
      # binary's outbound traffic blocked. The Android binary runs both in
      # a Termux container in the android-smoke job.
      - name: Offline smoke run
        if: runner.os == 'Windows'
        run: |
          cargo test -p prometheus --test demo_cli --test interrupt_windows --locked --target "${{ matrix.target }}"
          scripts/ci/offline-demo "target/${{ matrix.target }}/debug/prometheus.exe"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.target == 'aarch64-linux-android'
        with:
          name: prometheus-aarch64-linux-android
          path: target/aarch64-linux-android/debug/prometheus
          if-no-files-found: error

      # Supervisor units on Windows (messaging-gateway, Per-OS service
      # installation without elevation): the Scheduled Task, its
      # Startup-folder fallback when Task Scheduler refuses, and the daemon
      # inventory under %LOCALAPPDATA%.
      - name: Windows service install tests
        if: runner.os == 'Windows'
        run: cargo test -p prometheus --test gateway_service --features gateway --locked --target "${{ matrix.target }}"

      # Windows-only code with tests of its own: owner-only DACLs and
      # no-follow opens of private files (security-boundaries, Private file
      # modes). The full suite runs on the Unix check jobs.
      - name: Windows private-file tests
        if: runner.os == 'Windows'
        run: cargo test -p pmt-core --lib --locked --target "${{ matrix.target }}" -- private_fs

      # AppContainer + Job Object sandbox (security-boundaries, OS sandbox
      # per platform): writes outside the workspace and credential reads
      # fail, ACL entries are revoked, strength is reported per feature.
      - name: Windows sandbox tests
        if: runner.os == 'Windows' && !cancelled()
        run: cargo test -p pmt-sandbox --locked --target "${{ matrix.target }}"

      # The local terminal backend's shell resolution (execution-environments,
      # Windows local shell): with only the WSL launcher on PATH it falls
      # back to PowerShell, and commands run through the fallback shell.
      - name: Windows terminal tests
        if: runner.os == 'Windows'
        run: cargo test -p pmt-tools --locked --target "${{ matrix.target }}"

      # TUI background detection on a Windows console (tui, Terminal
      # background detection): the OSC 11 reply is read as console key
      # events with VT input on, within 100 ms, and the mode is restored.
      - name: Windows TUI console tests
        if: runner.os == 'Windows'
        run: cargo test -p pmt-tui --lib --locked --target "${{ matrix.target }}" -- background

      # Release verification, receipts, the update lock and the Windows
      # rename-aside swap of a running executable (distribution-and-update).
      - name: Windows update tests
        if: runner.os == 'Windows'
        run: cargo test -p pmt-update --locked --target "${{ matrix.target }}"

  # The Android (Termux) build's offline smoke run: `prometheus demo` and
  # the bundled smoke suite (`prometheus smoke-suite`, run by the binary
  # itself: there is no cargo in Termux) in the official Termux container
  # image for aarch64, natively on an arm64 runner, with `--network none`.
  android-smoke:
    name: offline smoke run (aarch64-linux-android, Termux)
    needs: build
    # The Windows legs of `build` must not hide the Android result; a failed
    # Android build fails here when its artifact is missing.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: prometheus-aarch64-linux-android
          path: target/android

      - name: prometheus demo and smoke suite in Termux, networking disabled
        run: |
          chmod 755 target/android/prometheus
          # termux/termux-docker:aarch64
          scripts/ci/offline-demo \
            --termux termux/termux-docker@sha256:18e2c6a633642d0806afd7abaeb0e74b2b957c92f6f30021260e5ba997579f48 \
            target/android/prometheus

  # install.sh in clean Linux containers against a signed fixture release
  # (spec: distribution-and-update, Installers): Debian verifies with
  # OpenSSL, Alpine with minisign; both check the receipt, the alias, the
  # PATH instructions, `--channel main` (exit 2) and a tampered archive
  # (exit 77, binary unchanged).
  installers-posix:
    name: installers (install.sh in containers)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          target: x86_64-unknown-linux-musl
          build-warnings: ""
          cache-key: installers-posix
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      - name: Build a static binary and a signed fixture release
        run: |
          cargo build --locked -p prometheus --target x86_64-unknown-linux-musl
          scripts/ci/installer-fixture target/installer-fixture \
            target/x86_64-unknown-linux-musl/debug/prometheus x86_64-unknown-linux-musl v0.0.1

      - name: Serve the fixture
        run: |
          (cd target/installer-fixture && python3 -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sleep 1

      - name: Debian (OpenSSL)
        run: |
          docker run --rm --network host -v "$PWD:/w" -w /w \
            debian@sha256:99c0b25c46d0214d5a2091092e7908907dcaecd6a962cde0ac700acee222b6f3 sh -c '
              apt-get update >/dev/null && apt-get install -y --no-install-recommends curl ca-certificates openssl >/dev/null &&
              useradd -m tester && su tester -c "sh scripts/ci/test-install-sh target/installer-fixture/install.sh http://127.0.0.1:8765 v0.0.1"'

      - name: Alpine (minisign)
        run: |
          docker run --rm --network host -v "$PWD:/w" -w /w \
            alpine@sha256:2e0b81d60597f449baa56dc25d355367869d2dca4cd57e866f1e2b52af3eb55f sh -c '
              apk add --no-cache curl minisign >/dev/null &&
              adduser -D tester && su tester -c "sh scripts/ci/test-install-sh target/installer-fixture/install.sh http://127.0.0.1:8765 v0.0.1"'

      # Every installer and update command of the install guide, run as
      # documented against a local signed release (task 20.10).
      - name: Install and update guide
        run: |
          scripts/ci/test-install-guide docs/guide/install-and-update.md \
            target/x86_64-unknown-linux-musl/debug/prometheus x86_64-unknown-linux-musl

  # install.ps1 under Windows PowerShell 5.1 and PowerShell 7 against the
  # same kind of fixture release.
  installers-windows:
    name: installers (install.ps1)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          build-warnings: ""
          cache-key: installers-windows
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build the binary and a signed fixture release
        run: |
          cargo build --locked -p prometheus
          scripts/ci/installer-fixture target/installer-fixture \
            target/debug/prometheus.exe x86_64-pc-windows-msvc v0.0.1

      - name: install.ps1 under PowerShell 7 and Windows PowerShell 5.1
        shell: pwsh
        run: |
          $server = Start-Process python -ArgumentList '-m', 'http.server', '8765', '--bind', '127.0.0.1' `
            -WorkingDirectory target/installer-fixture -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 2
          try {
            foreach ($shell in 'pwsh', 'powershell') {
              ./scripts/ci/test-install-ps1.ps1 -Installer target/installer-fixture/install.ps1 `
                -BaseUrl http://127.0.0.1:8765 -Tag v0.0.1 -Shell $shell
              if ($LASTEXITCODE -ne 0) { exit 1 }
            }
          } finally {
            Stop-Process -Id $server.Id -Force
          }

      - name: Install and update guide
        shell: pwsh
        run: |
          ./scripts/ci/test-install-guide.ps1 -Guide docs/guide/install-and-update.md `
            -Binary target/debug/prometheus.exe -Target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit 1 }

  # Distribution channels (spec: distribution-and-update): the NixOS and
  # Home Manager modules in a NixOS VM test (Nix-owned keys read-only, no
  # restart loop on exit 78, natively and in container mode) around a
  # static binary of this commit, and the Home Manager evaluation test. The container image
  # tests run in the x86_64 gnu check job (tests/container_image.rs).
  channels:
    name: distribution channels (NixOS module)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          target: x86_64-unknown-linux-musl
          build-warnings: ""
          cache-key: channels
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      - name: Build a static binary
        run: cargo build --locked -p prometheus --target x86_64-unknown-linux-musl

      - name: Enable KVM for the NixOS VM test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm

      - name: NixOS module VM test (tests/nix_module.rs)
        env:
          PMT_TEST_NIX: require
        run: |
          PMT_TEST_NIX_BINARY=$PWD/target/x86_64-unknown-linux-musl/debug/prometheus \
            cargo test --locked -p prometheus --test nix_module

  # Reproducible, locked builds (spec: distribution-and-update): the same
  # commit built twice on separate runners, as the release builds it
  # (`--locked`, the `dist` profile, the commit time as build date), must
  # give byte-identical static musl binaries.
  reproducible:
    name: reproducible build (${{ matrix.build }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      matrix:
        build: [first, second]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No build cache: each build starts from nothing.
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          target: x86_64-unknown-linux-musl
          build-warnings: ""
          cache: false

      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      - name: Locked release build
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          cargo build --locked --profile dist --target x86_64-unknown-linux-musl -p prometheus
          mkdir out
          cp target/x86_64-unknown-linux-musl/dist/prometheus out/
          (cd out && sha256sum prometheus | tee prometheus.sha256)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reproducible-${{ matrix.build }}
          path: out/

  reproducible-compare:
    name: reproducible build (identical digests)
    needs: reproducible
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: reproducible-*
      - name: Compare the two builds
        run: |
          cat reproducible-first/prometheus.sha256 reproducible-second/prometheus.sha256
          if ! cmp reproducible-first/prometheus reproducible-second/prometheus; then
            echo "two locked builds of ${GITHUB_SHA} differ" >&2
            exit 1
          fi
          echo "both builds: $(cut -d' ' -f1 reproducible-first/prometheus.sha256)"

  perf:
    name: perf (startup, memory, size)
    runs-on: ubuntu-24.04
    # A pull request builds two release trees (base + head); on a cold cache
    # the base build alone takes ~17 min, so 45 min cancelled the job.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          build-warnings: ""
          cache-key: perf
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}

      # The overhead gate runs the smoke suite, whose terminal steps run in
      # the OS sandbox; Ubuntu 24.04's AppArmor refuses the unprivileged
      # user namespaces it needs (the terminal tool then fails "sandbox
      # unavailable"), as in the check job.
      - name: Allow user namespaces for the terminal sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # A push to main checks the absolute budgets only.
      - name: Check the absolute budgets
        if: github.event_name == 'push'
        run: scripts/check --perf --update-baseline --baseline target/perf-main.json

      # The baseline is the pull request's base branch, built here and
      # measured in rounds alternating with the head in the same step
      # (`--base-binary`), so both see the same machine: measured ~20 min
      # apart, the runner's drift alone moved the head's `--version` 29%
      # and failed the chat prompt gate. A baseline recorded by another run
      # lands on another runner, and the chat prompt median alone moved
      # 22-32 ms between runs of one branch, past the 15% gate.
      # A pull request that changes perf/reference.json re-baselines
      # deliberately (the new reference-runner numbers are reviewed in its
      # diff) and is compared with that file instead. Without a base branch
      # (workflow_dispatch) the checked-in perf/baseline.json applies.
      - name: Build the base branch
        if: github.event_name != 'push'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -z "$BASE_REF" ]; then
            echo "no base branch; using perf/baseline.json"
            echo "PERF_ARGS=--baseline perf/baseline.json" >>"$GITHUB_ENV"
            exit 0
          fi
          git fetch --depth=1 origin "$BASE_REF"
          if ! git diff --quiet FETCH_HEAD HEAD -- perf/reference.json; then
            echo "perf/reference.json changed in this pull request; comparing with it"
            echo "PERF_ARGS=--baseline perf/reference.json" >>"$GITHUB_ENV"
            exit 0
          fi
          git worktree add --detach "$RUNNER_TEMP/perf-base" FETCH_HEAD
          # The base builds into a target dir of its own: cargo hashes path
          # crates relative to the workspace root, so a shared dir gives base
          # and head the same unit hashes, and the base checkout's newer
          # mtimes make its stale crates look fresh to the head build.
          (cd "$RUNNER_TEMP/perf-base" &&
            CARGO_TARGET_DIR="$RUNNER_TEMP/perf-base-target" \
              cargo build --locked --release --package prometheus)
          echo "PERF_ARGS=--base-binary $RUNNER_TEMP/perf-base-target/release/prometheus" >>"$GITHUB_ENV"

      - name: Check the budgets
        if: github.event_name != 'push'
        # PERF_ARGS is one flag and one path without spaces.
        run: scripts/check --perf $PERF_ARGS
