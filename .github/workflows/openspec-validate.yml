name: OpenSpec validate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: openspec-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: openspec validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # 7.0.0
        with:
          node-version: 22
      - name: Install OpenSpec CLI
        run: npm install -g @fission-ai/openspec@1.13.2
      - name: Validate specs and changes
        run: openspec validate --all --strict
