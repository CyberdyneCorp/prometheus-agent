# cargo-dist custom global job (dist-workspace.toml: global-artifacts-jobs).
# After the per-target builds it adds what cargo-dist does not make
# (spec: distribution-and-update, Release artifacts and targets; Signature
# trust root; Installers):
#
# - the macOS universal archive (lipo of the two macOS builds), attested
# - an SPDX 2.3 SBOM per target archive
# - release-manifest.json and the channel index
# - install.sh / install.ps1 with the release keys embedded
# - a minisign signature for every archive, the manifest, the index and
#   the installers
# - the container images (prometheus `<v>` and `<v>-full`,
#   prometheus-sandbox `<v>` and `<v>-desktop`, linux/amd64 + linux/arm64),
#   pushed by digest on a tag and pinned in the manifest
# - the desktop packages (macOS dmg and updater archive, Windows msixbundle
#   and App Installer file, Linux AppImage/deb/rpm), each built around the
#   release's CLI binary and signed per OS (Developer ID + notarization and
#   Authenticode on a tag; ad hoc and self-signed in the dry run), and the
#   desktop app's update feed
# - the package channels (`cargo xtask release channels`): Homebrew
#   formula, WinGet manifests and their Windows zips, Termux recipe and the
#   Nix release pins, published by the Release channels job
#
# and then verifies the complete set (`cargo xtask release verify`), so a
# release missing any artifact or signature fails here. Before any of that
# the dependency gates run (`scripts/ci/release-dependency-gates`: the
# advisory/license/source audit and the release-age gate), so an unwaived
# finding publishes nothing. On a tag push it
# signs with the PMT_RELEASE_SIGNING_KEY secret, which must be the primary
# or standby key embedded in the binary; on pull requests (the dry run) it
# signs with an ephemeral key. Every action is pinned to a commit SHA.

name: Release finalize

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read

jobs:
  universal:
    runs-on: macos-15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Fetch the macOS archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-build-local-*apple-darwin
          path: dist
          merge-multiple: true
      - name: Build the universal archive
        run: |
          set -euo pipefail
          cd dist
          for arch in aarch64 x86_64; do
            mkdir "$arch"
            tar -xzf "prometheus-$arch-apple-darwin.tar.gz" -C "$arch"
          done
          name=prometheus-universal2-apple-darwin
          mkdir "$name"
          lipo -create -output "$name/prometheus" \
            "$(find aarch64 -type f -name prometheus)" "$(find x86_64 -type f -name prometheus)"
          lipo "$name/prometheus" -verify_arch arm64 x86_64
          tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" >"$name.tar.gz.sha256"
      - name: Attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/prometheus-universal2-apple-darwin.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: universal-archive
          path: |
            dist/prometheus-universal2-apple-darwin.tar.gz
            dist/prometheus-universal2-apple-darwin.tar.gz.sha256

  # The desktop packages (spec: distribution-and-update, Desktop packages and
  # signing): each bundles the release's own `prometheus` binary with its
  # install receipt. On a tag a failed signing, notarization or check drops
  # that OS's packages (continue-on-error) and the rest of the release still
  # publishes; in the dry run it fails the run, and `release verify
  # --require-desktop` insists on every OS.
  desktop-prepare:
    runs-on: ubuntu-24.04
    env:
      PLAN: ${{ inputs.plan }}
      PUBLISHING: ${{ startsWith(github.ref, 'refs/tags/') }}
      WINDOWS_PUBLISHER: ${{ vars.PMT_WINDOWS_PUBLISHER }}
      STORE_PUBLISHER: ${{ vars.PMT_STORE_PUBLISHER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          build-warnings: ""
          cache-key: release-desktop-prepare
      - name: MSIX manifests and the App Installer file
        run: |
          set -euo pipefail
          tag=$(jq -r '.announcement_tag' <<<"$PLAN")
          if [ "$PUBLISHING" = true ]; then
            [ -n "$WINDOWS_PUBLISHER" ] || { echo "the PMT_WINDOWS_PUBLISHER variable is not set" >&2; exit 1; }
            publisher=$WINDOWS_PUBLISHER
            store=${STORE_PUBLISHER:-$WINDOWS_PUBLISHER}
          else
            publisher="CN=Prometheus Dry Run"
            store=$publisher
          fi
          cargo xtask release msix --tag "$tag" --publisher "$publisher" \
            --store-publisher "$store" --out manifests
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-manifests
          path: manifests

  desktop-macos:
    needs: universal
    runs-on: macos-15
    continue-on-error: ${{ startsWith(github.ref, 'refs/tags/') }}
    env:
      PLAN: ${{ inputs.plan }}
      PUBLISHING: ${{ startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          build-warnings: ""
          target: aarch64-apple-darwin,x86_64-apple-darwin
          cache-key: release-desktop-macos
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: tauri-cli@2.12.4
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: universal-archive
          path: dist
      - name: Build, sign and check
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # The in-app updater trusts the release key (none in a dry run:
          # that build has no updater).
          if [ "$PUBLISHING" = true ]; then
            PMT_DESKTOP_RELEASE_KEY=$(cat crates/pmt-update/keys/primary.pub)
            export PMT_DESKTOP_RELEASE_KEY
          fi
          scripts/ci/desktop-package macos dist desktop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-package-macos
          path: desktop
          if-no-files-found: error

  desktop-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, arch: x86_64 }
          - { runner: ubuntu-22.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ startsWith(github.ref, 'refs/tags/') }}
    env:
      PLAN: ${{ inputs.plan }}
      PUBLISHING: ${{ startsWith(github.ref, 'refs/tags/') }}
      # linuxdeploy is itself an AppImage; no FUSE needed to run it.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          build-warnings: ""
          cache-key: release-desktop-linux
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: tauri-cli@2.12.4
      - name: Install the webview libraries and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            librsvg2-dev libxdo-dev libayatana-appindicator3-dev patchelf file rpm libfuse2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: artifacts-build-local-${{ matrix.arch }}-unknown-linux-gnu
          path: dist
      - name: Build and check
        run: |
          set -euo pipefail
          if [ "$PUBLISHING" = true ]; then
            PMT_DESKTOP_RELEASE_KEY=$(cat crates/pmt-update/keys/primary.pub)
            export PMT_DESKTOP_RELEASE_KEY
          fi
          scripts/ci/desktop-package linux dist desktop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-package-linux-${{ matrix.arch }}
          path: desktop
          if-no-files-found: error

  desktop-windows-app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-2025, arch: x86_64 }
          - { runner: windows-11-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ startsWith(github.ref, 'refs/tags/') }}
    env:
      PLAN: ${{ inputs.plan }}
      PUBLISHING: ${{ startsWith(github.ref, 'refs/tags/') }}
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          build-warnings: ""
          cache-key: release-desktop-windows
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: tauri-cli@2.12.4
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: artifacts-build-local-${{ matrix.arch }}-pc-windows-msvc
          path: dist
      - name: Build the app and stamp the receipts
        shell: pwsh
        run: |
          if ($env:PUBLISHING -eq "true") {
            $env:PMT_DESKTOP_RELEASE_KEY = Get-Content crates/pmt-update/keys/primary.pub -Raw
          }
          scripts/ci/desktop-package.ps1 -Step app -Dist dist -Out apps
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-windows-app-${{ matrix.arch }}
          path: apps
          if-no-files-found: error

  desktop-windows:
    needs: [desktop-prepare, desktop-windows-app]
    runs-on: windows-2025
    continue-on-error: ${{ startsWith(github.ref, 'refs/tags/') }}
    env:
      PLAN: ${{ inputs.plan }}
      PUBLISHING: ${{ startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-windows-app-*
          path: apps
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-manifests
          path: manifests
      - name: Bundle, sign, install and check
        shell: pwsh
        env:
          PMT_WINDOWS_CERT_PFX: ${{ secrets.PMT_WINDOWS_CERT_PFX }}
          PMT_WINDOWS_CERT_PASSWORD: ${{ secrets.PMT_WINDOWS_CERT_PASSWORD }}
        run: scripts/ci/desktop-package.ps1 -Step bundle -Apps apps -Manifests manifests -Out desktop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-package-windows
          path: |
            desktop/prometheus-desktop-x86_64-pc-windows-msvc.msixbundle
            desktop/prometheus-desktop.appinstaller
          if-no-files-found: error
      # Not a release asset: the Microsoft Store submission's bundle.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-store
          path: desktop/store
          if-no-files-found: error

  finalize:
    needs: [universal, desktop-macos, desktop-linux, desktop-windows]
    # Runs when a desktop job failed too: that OS then publishes no desktop
    # package (on a tag) or the dry run's verify step names it.
    if: ${{ !cancelled() && needs.universal.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      PLAN: ${{ inputs.plan }}
      PUBLISHING: ${{ startsWith(github.ref, 'refs/tags/') }}
    steps:
      # Full history and tags: the release-age gate compares Cargo.lock with
      # the previous release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          build-warnings: ""
          cache-key: release-finalize
      - name: Read pinned tool versions from scripts/check
        run: sed -n 's/^readonly \([A-Z_]*_VERSION\)=\(.*\)$/\1=\2/p' scripts/check >>"$GITHUB_ENV"
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-deny@${{ env.CARGO_DENY_VERSION }}
      - name: Dependency gates
        run: scripts/ci/release-dependency-gates
      - name: Fetch the target archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-build-local-*
          path: dist
          merge-multiple: true
      - name: Fetch the universal archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: universal-archive
          path: dist
      - name: Fetch the desktop packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-package-*
          path: dist
          merge-multiple: true
      - name: Build the release tooling
        run: cargo build --locked -p xtask
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to the container registry
        if: env.PUBLISHING == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Container images
        run: |
          set -euo pipefail
          tag=$(jq -r '.announcement_tag' <<<"$PLAN")
          version=${tag#v}
          case "$tag" in *-canary.*) channel=canary ;; *) channel=stable ;; esac
          ctx="$RUNNER_TEMP/image"
          cargo xtask release container-context --dir dist --out "$ctx"
          # A tag pushes by digest; a dry run only builds.
          if [ "$PUBLISHING" = true ]; then output=type=image,push=true; else output=type=cacheonly; fi
          echo '{}' >"$RUNNER_TEMP/images.json"
          build() { # <image> <tag> <dockerfile> <target>
            docker buildx build --platform linux/amd64,linux/arm64 \
              --file "$ctx/$3" --target "$4" --build-arg "CHANNEL=$channel" \
              --tag "ghcr.io/cyberdynecorp/$1:$2" --output "$output" \
              --metadata-file "$RUNNER_TEMP/meta.json" "$ctx"
            digest=$(jq -r '."containerimage.digest" // empty' "$RUNNER_TEMP/meta.json")
            if [ -n "$digest" ]; then
              jq --arg k "$1:$2" --arg v "ghcr.io/cyberdynecorp/$1@$digest" '. + {($k): $v}' \
                "$RUNNER_TEMP/images.json" >"$RUNNER_TEMP/images.next" && mv "$RUNNER_TEMP/images.next" "$RUNNER_TEMP/images.json"
            fi
          }
          build prometheus "$version" Dockerfile runtime
          build prometheus "$version-full" Dockerfile full
          build prometheus-sandbox "$version" sandbox.Dockerfile sandbox
          build prometheus-sandbox "$version-desktop" sandbox.Dockerfile desktop
      - name: SBOMs, manifest, channel index, installers and package channels
        run: |
          set -euo pipefail
          tag=$(jq -r '.announcement_tag' <<<"$PLAN")
          for archive in dist/prometheus-*.tar.gz; do
            # The desktop updater archive is not a CLI target.
            case "$archive" in dist/prometheus-desktop-*) continue ;; esac
            target=$(basename "$archive" .tar.gz)
            target=${target#prometheus-}
            cargo xtask release sbom --target "$target" --out "dist/prometheus-$target.spdx.json"
          done
          cargo xtask release manifest --dir dist --tag "$tag" --commit "$GITHUB_SHA" \
            --images "$RUNNER_TEMP/images.json"
          cargo xtask release installers --out dist
          # The desktop app's update feed over the updater archives present.
          cargo xtask release desktop-feed --dir dist --tag "$tag"
          cargo xtask release channels --dir dist --out "$RUNNER_TEMP/channels"
          cp "$RUNNER_TEMP"/channels/archives/*.zip dist/
          # The reference deployments, attached to the release.
          cp distrib/container/compose.yaml distrib/container/compose.isolated.yaml \
            distrib/container/squid.conf dist/
          # The supply-chain advisory catalog this release embeds, published
          # signed beside the channel indexes for installed builds to refresh.
          cp crates/pmt-update/advisories/advisories.json dist/advisories.json
          # The runtime index this release pins, signed, for offline
          # bundles (`prometheus bundle create --with ...`).
          cp crates/pmt-update/runtimes/index.json dist/runtime-index.json
      - name: Sign
        env:
          RELEASE_KEY: ${{ secrets.PMT_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ "$PUBLISHING" = true ]; then
            [ -n "$RELEASE_KEY" ] || { echo "PMT_RELEASE_SIGNING_KEY is not set" >&2; exit 1; }
            export SIGNING_KEY="$RELEASE_KEY"
            embedded=--require-embedded
          else
            # Dry run: an ephemeral key, discarded with the runner.
            cargo xtask release keygen --out "$RUNNER_TEMP/dry-run" --name dry-run
            SIGNING_KEY=$(cat "$RUNNER_TEMP/dry-run/dry-run.key")
            export SIGNING_KEY
            embedded=
          fi
          # The desktop files of the OSes whose packages were built (the
          # macOS updater archive is among the .tar.gz files already).
          shopt -s nullglob
          desktop=(dist/prometheus-desktop*.{dmg,msixbundle,AppImage,deb,rpm}
            dist/prometheus-desktop.appinstaller dist/desktop-*.json)
          cargo xtask release sign --key-env SIGNING_KEY $embedded \
            --public-key-out "$RUNNER_TEMP/signing.pub" \
            dist/prometheus-*.tar.gz dist/prometheus-*.zip dist/release-manifest.json dist/channel-*.json \
            dist/advisories.json dist/runtime-index.json dist/install.sh dist/install.ps1 "${desktop[@]}"
      - name: Verify every artifact
        run: |
          set -euo pipefail
          # The dry run insists on every OS's desktop packages; a tag
          # publishes those whose signing succeeded.
          if [ "$PUBLISHING" = true ]; then require=; else require=--require-desktop; fi
          cargo xtask release verify --dir dist --key "$RUNNER_TEMP/signing.pub" $require
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-release-finalize
          path: |
            dist/prometheus-universal2-apple-darwin.tar.gz
            dist/prometheus-universal2-apple-darwin.tar.gz.sha256
            dist/prometheus-*.zip
            dist/compose.yaml
            dist/compose.isolated.yaml
            dist/squid.conf
            dist/*.minisig
            dist/*.spdx.json
            dist/release-manifest.json
            dist/channel-*.json
            dist/advisories.json
            dist/runtime-index.json
            dist/install.sh
            dist/install.ps1
            dist/prometheus-desktop*
            dist/desktop-*.json
      # Not an `artifacts-*` artifact: the channel files are published by the
      # Release channels job, not attached to the GitHub release.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-channels
          path: ${{ runner.temp }}/channels
