# TEMPORARY: Windows sandboxed terminal checks (task 21.2).
name: win-diag
on:
  push:
    branches: [m1-core-agent]
    paths: [".github/workflows/win-diag.yml", "crates/**"]
jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          build-warnings: ""
          cache-key: win-diag
      - name: sandbox
        shell: bash
        run: cargo test -p pmt-sandbox --locked
      - name: terminal
        shell: bash
        if: always()
        run: cargo test -p prometheus --locked --test terminal_windows -- --nocapture
      - name: demo
        shell: bash
        if: always()
        run: |
          cargo test -p prometheus --locked --test demo_cli
          scripts/ci/offline-demo target/debug/prometheus.exe
      - name: tools
        shell: bash
        if: always()
        run: cargo test -p pmt-tools --locked
