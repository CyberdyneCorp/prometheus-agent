[package]
name = "xtask"
description = "Repository automation: generated contracts, reference docs and the code-health ratchet"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
clap.workspace = true
pmt-config.workspace = true
pmt-core.workspace = true
prometheus.workspace = true
# Line numbers of syntax nodes, needed to measure function length.
proc-macro2 = { version = "1.0", features = ["span-locations"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
syn = { version = "3.0", default-features = false, features = ["full", "parsing", "visit"] }
toml = "1.1"

[lints]
workspace = true
