# cargo-deny policy: license allowlist and known-advisory check
# (spec: workspace-architecture, Repository health gates).

[graph]
all-features = true

[advisories]
# Every RustSec advisory (vulnerability, unmaintained, unsound, yanked) fails
# the check; an exception goes in `ignore` with the advisory id and a reason.
unmaintained = "all"
yanked = "deny"
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.93
# The allowlist is the spec policy, not a list of licenses currently in use.
unused-allowed-license = "allow"

# Mozilla's root list as data; only a wasm32 dependency of
# rustls-platform-verifier (never built for a supported target), but the
# graph covers every target.
[[licenses.exceptions]]
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

# The line editor's Windows clipboard support (rustyline -> clipboard-win
# -> error-code). Boost Software License 1.0: permissive, OSI approved, no
# attribution in binaries; allowed for these two crates only.
[[licenses.exceptions]]
crate = "clipboard-win"
allow = ["BSL-1.0"]

[[licenses.exceptions]]
crate = "error-code"
allow = ["BSL-1.0"]

# The WASM plugin host (design D7): wasmtime, Cranelift and their internal
# crates are Apache-2.0 with the LLVM exception, which only adds a
# permission to Apache-2.0; allowed for these crates only.
[[licenses.exceptions]]
crate = "cranelift-assembler-x64"
allow = ["Apache-2.0 WITH LLVM-exception"]

[[licenses.exceptions]]
crate = "cranelift-assembler-x64-meta"
allow = ["Apache-2.0 WITH LLVM-exception"]

[[licenses.exceptions]]
crate = "cranelift-bforest"
allow = ["Apache-2.0 WITH LLVM-exception"]

[[licenses.exceptions]]
crate = "cranelift-bitset"
allow = ["Apache-2.0 WITH LLVM-exception"]

[[licenses.exceptions]]
crate = "cranelift-codegen"
allow = ["Apache-2.0 WITH LLVM-exception"]

[[licenses.exceptions]]
crate = "cranelift-codegen-meta"
allow = ["Apache-2.0 WITH LLVM-exception"]

[[licenses.exceptions]]
crate = "cranelift-codegen-shared"
allow = ["Apache-2.0 WITH LLVM-exception"]

[[licenses.exceptions]]
crate = "cranelift-control"
allow = ["Apache-2.0 WITH LLVM-exception"]

[[licenses.exceptions]]
crate = "cranelift-entity"
allow = ["Apache-2.0 WITH LLVM-exception"]

[[licenses.exceptions]]
crate = "cranelift-frontend"
allow = ["Apache-2.0 WITH LLVM-exception"]

[[licenses.exceptions]]
crate = "cranelift-isle"
allow = ["Apache-2.0 WITH LLVM-exception"]

[[licenses.exceptions]]
crate = "cranelift-native"
allow = ["Apache-2.0 WITH LLVM-exception"]

[[licenses.exceptions]]
crate = "cranelift-srcgen"
allow = ["Apache-2.0 WITH LLVM-exception"]

[[licenses.exceptions]]
crate = "pulley-interpreter"
