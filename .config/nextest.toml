# Each test of pmt-tools' browser binary starts a real headless Chromium.
# Run in parallel with each other (and the rest of the suite), several
# browsers starting at once on a small CI runner can take longer than the
# 30 s launch and CDP command timeouts, which shows up as unrelated
# "did not start within 30 s" / "timed out after 30 s" failures. Two at a
# time keeps the suite's wall time close while leaving each launch the
# CPU it needs.
[test-groups]
browser = { max-threads = 2 }

[[profile.default.overrides]]
filter = "package(pmt-tools) & binary(browser)"
test-group = "browser"

# The dashboard's and the desktop page's browser tests start a Playwright Chromium each.
[[profile.default.overrides]]
filter = "package(prometheus) & (binary(dashboard_e2e) | binary(dashboard_browser) | binary(desktop_e2e))"
test-group = "browser"

# The real-pyright LSP test downloads pyright from the npm registry on
# first use (CI sets PMT_TEST_LSP=require). A registry or network hiccup
# is not a product failure: retry it, and report it as flaky when a retry
# passes.
[[profile.default.overrides]]
filter = "package(pmt-tools) & binary(lsp) & test(pyright_reports_an_undefined_name_after_a_patch)"
retries = 2
