# The scenario-to-test index (task 21.3): the scenarios of each milestone's
# requirements, for its capabilities below, and the tests that prove them.
# `cargo xtask scenarios` (run by scripts/check, whose test suite runs every
# named test) fails when a scenario of a complete (not `partial`) milestone
# has no entry, an entry names a scenario the specs no longer have, or a
# named test does not exist.
#
# Keys: [<capability>."<requirement>"] "<scenario>" = ["<file>::<test fn>", ...]
# A `note` says how the tests prove a scenario when that is not obvious; a
# `deferred` entry names the later-milestone component a scenario needs.

specs = "openspec/changes/bootstrap-prometheus-agent/specs"

[milestones.M1]
capabilities = [
    "workspace-architecture",
    "configuration-and-profiles",
    "session-storage",
    "observability",
    "security-boundaries",
    "execution-environments",
    "model-providers",
    "tool-system",
    "agent-turn-loop",
    "context-compression",
    "skills",
    "memory",
    "cli",
    "distribution-and-update",
    "web-and-media-tools",
    # Named by tasks 12.1, 12.2 and 21.1-21.2 though task 21.3 lists the
    # fifteen above; its M1 scenarios are indexed too.
    "replay-and-evaluation",
]

# M2 (task groups 22-60) is complete: every scenario of its requirements
# maps to tests (task 60.6).
[milestones.M2]
capabilities = [
    "agent-interop",
    "agent-turn-loop",
    "api-server",
    "cli",
    "configuration-and-profiles",
    "connectors",
    "context-compression",
    "distribution-and-update",
    "execution-environments",
    "git-worktrees",
    "hermes-migration",
    "i18n",
    "local-models",
    "lsp-diagnostics",
    "memory",
    "messaging-gateway",
    "mixture-of-agents",
    "model-providers",
    "observability",
    "platform-adapters",
    "plugin-system",
    "projects",
    "python-bridge",
    "replay-and-evaluation",
    "scheduled-jobs",
    "security-boundaries",
    "session-automation",
    "session-storage",
    "skills",
    "subagent-delegation",
    "tool-system",
    "tui",
    "voice-mode",
    "web-and-media-tools",
    "workspace-architecture",
]

# M3 (task groups 61-81) is being implemented: its indexed scenarios are
# checked, unindexed ones are pending. Each area adds its capabilities
# here; drop `partial` when M3 is complete (task 81.x).
[milestones.M3]
partial = true
capabilities = [
    "desktop-app",
    "messaging-gateway",
    "web-dashboard",
]

