[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
# No license field until the project license is chosen (README: TBD); nothing
# is published, and cargo-deny skips the workspace's own private crates.
publish = false
repository = "https://github.com/CyberdyneCorp/prometheus-agent"

[workspace.dependencies]
pmt-config = { path = "crates/pmt-config" }
pmt-core = { path = "crates/pmt-core" }
pmt-net = { path = "crates/pmt-net" }
pmt-obs = { path = "crates/pmt-obs" }
pmt-store = { path = "crates/pmt-store" }
prometheus = { path = "crates/prometheus" }
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jiff = "0.2"
tokio = { version = "1.54", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
tokio-util = "0.7"
tempfile = "3.27"
ulid = "3.0"
toml = "1.1"
tracing = "0.1"
sha2 = "0.11"
reqwest = { version = "0.13", default-features = false }
nix = { version = "0.31", default-features = false, features = ["resource"] }
sysinfo = { version = "0.38", default-features = false, features = ["system"] }
clap = { version = "4.5", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions", "derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
