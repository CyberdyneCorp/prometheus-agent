[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
# No license field until the project license is chosen (README: TBD); nothing
# is published, and cargo-deny skips the workspace's own private crates.
publish = false
repository = "https://github.com/CyberdyneCorp/prometheus-agent"

[workspace.dependencies]
pmt-agent = { path = "crates/pmt-agent" }
pmt-automation = { path = "crates/pmt-automation" }
pmt-config = { path = "crates/pmt-config" }
pmt-core = { path = "crates/pmt-core" }
pmt-cron = { path = "crates/pmt-cron" }
pmt-delegation = { path = "crates/pmt-delegation" }
pmt-eval = { path = "crates/pmt-eval" }
pmt-worktrees = { path = "crates/pmt-worktrees" }
pmt-memory = { path = "crates/pmt-memory" }
pmt-mcp = { path = "crates/pmt-mcp" }
pmt-media = { path = "crates/pmt-media" }
pmt-net = { path = "crates/pmt-net" }
pmt-obs = { path = "crates/pmt-obs" }
pmt-plugins = { path = "crates/pmt-plugins" }
pmt-providers = { path = "crates/pmt-providers" }
pmt-pybridge = { path = "crates/pmt-pybridge" }
pmt-rpc = { path = "crates/pmt-rpc" }
pmt-gateway = { path = "crates/pmt-gateway" }
pmt-adapters-telegram = { path = "crates/pmt-adapters-telegram" }
pmt-adapters-discord = { path = "crates/pmt-adapters-discord" }
pmt-adapters-email = { path = "crates/pmt-adapters-email" }
pmt-adapters-matrix = { path = "crates/pmt-adapters-matrix" }
pmt-adapters-signal = { path = "crates/pmt-adapters-signal" }
pmt-adapters-slack = { path = "crates/pmt-adapters-slack" }
pmt-adapters-webhook = { path = "crates/pmt-adapters-webhook" }
pmt-adapters-whatsapp = { path = "crates/pmt-adapters-whatsapp" }
pmt-sandbox = { path = "crates/pmt-sandbox" }
pmt-skills = { path = "crates/pmt-skills" }
pmt-store = { path = "crates/pmt-store" }
pmt-tools = { path = "crates/pmt-tools" }
pmt-tui = { path = "crates/pmt-tui" }
pmt-update = { path = "crates/pmt-update" }
pmt-voice = { path = "crates/pmt-voice" }
pmt-local = { path = "crates/pmt-local" }
prometheus = { path = "crates/prometheus" }
schemars = "1.2"
# MCP client and server (design D7): stdio and streamable HTTP transports,
# no macros, OAuth or child-process wrapper (stdio servers are spawned
# through the execution sandbox and handed over as pipes).
rmcp = { version = "3.9.0", default-features = false }
# WASM plugin host (design D7): the Component Model on Cranelift, with no
# WASI (plugins get only the WIT host interfaces) and no on-disk code cache.
wasmtime = { version = "48.0.8", default-features = false, features = ["runtime", "cranelift", "component-model", "std", "call-hook"] }
# Test-only: turns the sample plugins' core modules into components.
wit-component = "0.254.2"
# `requires_prometheus` ranges and WIT world versions.
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jiff = "0.2"
tokio = { version = "1.54", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
tokio-util = "0.7"
tempfile = "3.27"
ulid = "3.0"
toml = "1.1"
# Format-preserving config writes (comments, order, spans for line numbers).
toml_edit = "0.25"
# Compile-fail tests of the ProfileScope API contract.
trybuild = "1.0"
tracing = "0.1"
sha2 = "0.11"
# TOTP codes of vault logins (HMAC-SHA1, RFC 6238).
sha1 = "0.11"
# Base32 TOTP seeds.
data-encoding = "2.11"
# Terminal QR codes for `gateway whatsapp pair` (no image rendering).
qrcode = { version = "0.14", default-features = false }
reqwest = { version = "0.13", default-features = false }
# TLS for every outbound client: rustls on the ring provider (aws-lc-sys
# carries the OpenSSL license, outside deny.toml) with the platform verifier,
# so OS-installed roots (corporate CAs) are trusted.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
# RS256 signatures of Google service-account assertions (minted Vertex AI
# tokens); the same ring rustls already uses.
ring = "0.17"
# The OS roots exported into the CA bundle handed to sandboxed children.
rustls-native-certs = "0.8"
# Decrypts an encrypted PKCS#8 client key of an mTLS MCP server
# (`client_key_password_secret`).
pkcs8 = { version = "0.10", default-features = false, features = ["encryption", "pem", "std"] }
base64 = "0.23"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
resvg = { version = "0.49", default-features = false }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
percent-encoding = "2.3"
# CRC-32 checks of AWS event-stream frames (Bedrock ConverseStream).
crc32fast = "1.5"
# Inbound mail of the email adapter.
mail-parser = { version = "0.11", default-features = false }
# CIDR ranges (`security.egress.fake_ip_ranges`, private-destination grants).
ipnet = "2.12"
# Basename globs of protected instruction files.
glob = "0.3"
# Mock provider script matchers (last user message / tool result).
regex = "1.12"
# Test-only TLS server and certificates (fetch and trust-store tests).
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
nix = { version = "0.31", default-features = false, features = ["resource", "fs"] }
sysinfo = { version = "0.38", default-features = false, features = ["system"] }
# OS keychain secrets backend: keyring-core with one native store per OS
# (macOS Keychain, Windows Credential Manager, Secret Service over libdbus
# elsewhere; the zbus-based store depends on unmaintained crates).
keyring-core = "1.0"
apple-native-keyring-store = { version = "1.0", features = ["keychain"] }
windows-native-keyring-store = "1.0"
dbus-secret-service-keyring-store = { version = "1.0", features = ["crypto-rust", "vendored"] }
# No-echo prompts for secret values.
rpassword = "7.5"
# SQLite (bundled); the online backup API copies live databases.
rusqlite = { version = "0.41", features = ["bundled", "backup"] }
# Release signatures (spec: distribution-and-update, Signature trust root):
# verification in the binary, signing only in xtask and tests.
minisign-verify = "0.3"
minisign = "0.10"
# Release archives are `.tar.gz` on every target.
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
# Whole-home backup archives (`.tar.zst`).
tar = { version = "0.4", default-features = false }
zstd = { version = "0.14", default-features = false }
# Runtime archives published only as `.zip` (Chrome for Testing, Windows
# builds of Node and uv); deflate through the flate2 backend above.
zip = { version = "9.0", default-features = false, features = ["deflate-flate2"] }
# read_file document extraction: the XML parts of .docx and .xlsx files.
roxmltree = "0.21"
pmt-backup = { path = "crates/pmt-backup" }
pmt-vault = { path = "crates/pmt-vault" }
# Property tests (store transaction atomicity).
proptest = { version = "1.9", default-features = false, features = ["std"] }
# Test-only capture of log events; 7.3 installs the real subscriber.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
# OS sandbox: Landlock rulesets and seccomp-bpf filters (Linux), raw
# constants for both, and the AppContainer/Job Object API (Windows).
landlock = "0.4"
seccompiler = "0.5"
libc = "0.2"
# flock(2) on Android, where std's File::try_lock is unsupported.
rustix = { version = "1.1", default-features = false, features = ["std", "fs"] }
# Plain (non-`\\?\`) Windows paths for shells that mishandle verbatim ones.
dunce = "1.0"
windows-sys = "0.61"
# The machine-wide ProgramData folder (Known Folder API) for the managed
# configuration layer on Windows.
known-folders = "1.4"
# Full jitter of provider retry backoff.
fastrand = "2.3"
# OS randomness for sign-in secrets (PKCE verifier, OAuth state).
getrandom = "0.4"
# Profile export: passphrase key derivation and authenticated encryption of
# the exported secrets.
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
# URL parsing and form encoding of sign-in requests and callbacks.
url = "2.5"
# Test-only HTTP mock server (recorded provider stream fixtures).
wiremock = "0.6"
# The gateway's shared HTTP listener for webhook-style adapters.
hyper = { version = "1.12", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"
bytes = "1.12"
# search_files: .gitignore-aware directory walks.
ignore = "0.4"
# Unified diffs of file tool edits.
similar = "3.2"
# Post-write syntax checks: tree-sitter grammars (Rust, Python,
# JavaScript, TypeScript) and a YAML 1.2 event parser.
tree-sitter = "0.27"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
saphyr-parser = "0.3"
# The line interface's editor (history, multi-line, completion, printing
# above the prompt while a turn runs).
rustyline = { version = "19.0", default-features = false, features = ["with-file-history", "custom-bindings"] }
# Renders the final answer's Markdown in the line interface
# (`display.final_response_markdown`).
pulldown-cmark = { version = "0.13", default-features = false }
# Test-only: drives the line interface through a pseudo-terminal.
expectrl = "0.9"
# The full-screen terminal UI: layout and widgets over the crossterm
# backend (raw mode, alternate screen, mouse, bracketed paste).
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.29", default-features = false, features = ["bracketed-paste", "events", "windows"] }
# Safe console-mode and input-record calls (Windows OSC 11 query).
crossterm_winapi = "0.9"
# Display width of composer and transcript text.
unicode-width = "0.2"
clap = { version = "4.5", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions", "derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

# Argon2id runs a real key derivation in the profile-export tests.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# Plugin tests compile WASM components inside the `plugins.load_timeout_ms`
# deadline; an unoptimized Cranelift needs several seconds per component and
# overran the deadline on loaded CI runners.
[profile.dev.package.cranelift-codegen]
opt-level = 3
[profile.dev.package.cranelift-assembler-x64]
opt-level = 3
[profile.dev.package.cranelift-frontend]
opt-level = 3
[profile.dev.package.cranelift-bforest]
opt-level = 3
[profile.dev.package.cranelift-bitset]
opt-level = 3
[profile.dev.package.cranelift-entity]
opt-level = 3
[profile.dev.package.cranelift-control]
opt-level = 3
[profile.dev.package.regalloc2]
opt-level = 3
[profile.dev.package.wasmtime]
opt-level = 3
[profile.dev.package.wasmtime-environ]
opt-level = 3
[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 3
[profile.dev.package.wasmparser]
opt-level = 3

# Shell completion runs on every TAB and must answer within 200 ms on a store
# of 10000 sessions (spec: cli); its test times the dev binary, where an
# unoptimized clap (building the whole command tree with its debug checks)
# and SQLite took most of that on loaded Intel macOS runners.
[profile.dev.package.clap_builder]
opt-level = 3
[profile.dev.package.libsqlite3-sys]
opt-level = 3

# The update tests archive, sign, download, verify and unpack a copy of the
# ~250 MiB dev binary several times each; unoptimized gzip, CRC, SHA-256
# and BLAKE2b (minisign's own) made each of them take minutes on Intel
# macOS runners (job timeout).
[profile.dev.package.minisign]
opt-level = 3
[profile.dev.package.minisign-verify]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.adler2]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.tar]
opt-level = 3

[profile.release]
# Fat LTO: one optimization unit across every crate drops what thin LTO
# keeps per crate (duplicate generic instantiations, unused paths); the
# stripped binary is about 9% smaller for twice the release build time
# (perf/README.md).
lto = "fat"
codegen-units = 1
# Size-optimized code: the stripped binary is 28% smaller with unchanged
# startup, chat prompt and peak RSS; the agent's time goes to network and
# model latency, not to tight loops (perf/README.md).
opt-level = "s"
strip = "symbols"

# The profile cargo-dist builds the release archives with (dist-workspace.toml).
[profile.dist]
inherits = "release"
